[package]
name = "sift-music"
version = "0.4.0"
edition = "2024"
description = "Music tagger and library organiser: MusicBrainz matching, tag writing, cover art, fb2k-style paths"
license = "MIT"
repository = "https://github.com/radiosilence/sift"
keywords = ["music", "musicbrainz", "tagging", "foobar2000"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = [".github", "lefthook.yml", "mise.toml"]

# `sift` is taken on crates.io; the library and binary keep the name.
[lib]
name = "sift"

[[bin]]
name = "sift"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6"
deunicode = "1.6.2"
dirs = "7.0.0"
ebur128 = "0.1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
strsim = "0.11.1"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "wav", "aiff", "pcm", "alac", "isomp4", "aac", "mp3", "ogg", "vorbis", "id3v1", "id3v2"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1.44"
unicode-normalization = "0.1.25"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
