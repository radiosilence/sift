[package]
name = "sift-music"
version = "0.9.3"
edition = "2024"
description = "Music tagger and library organiser: MusicBrainz matching, tag writing, cover art, fb2k-style paths"
license = "MIT"
repository = "https://github.com/radiosilence/sift"
keywords = ["music", "musicbrainz", "tagging", "foobar2000"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = [".github", "changelog.d", "scripts", "justfile", "lefthook.yml", "mise.toml"]

# `sift` is taken on crates.io; the library and binary keep the name.
[lib]
name = "sift"

[[bin]]
name = "sift"
path = "src/main.rs"
required-features = ["tagger"]

# `format` alone needs none of the tagger's dependencies; `default-features =
# false` builds just the template engine.
[features]
default = ["tagger"]
tagger = [
    "dep:anyhow",
    "dep:bytes",
    "dep:clap",
    "dep:clap_complete",
    "dep:deunicode",
    "dep:dirs",
    "dep:ebur128",
    "dep:image",
    "dep:indexmap",
    "dep:lofty",
    "dep:regex",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:serde",
    "dep:serde_json",
    "dep:serde-saphyr",
    "dep:strsim",
    "dep:symphonia",
    "dep:tokio",
    "dep:tracing",
    "dep:unicode-normalization",
]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
bytes = { version = "1.12.1", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
deunicode = { version = "1.6.2", optional = true }
dirs = { version = "7.0.0", optional = true }
ebur128 = { version = "0.1.10", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
indexmap = { version = "2.14.2", features = ["serde"], optional = true }
lofty = { version = "0.25", optional = true }
regex = { version = "1.13.1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"], optional = true }
strsim = { version = "0.11.1", optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "wav", "aiff", "pcm", "alac", "isomp4", "aac", "mp3", "ogg", "vorbis", "id3v1", "id3v2"], optional = true }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"], optional = true }
tracing = { version = "0.1.44", optional = true }
unicode-normalization = { version = "0.1.26", optional = true }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
