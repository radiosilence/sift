name: CI/CD

# Two halves in one run, so the second can use what the first built.
#
# CI checks the change and ends in `Checks`, the one status the ruleset
# requires. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails
# it. Jobs can therefore be added, renamed or skipped without touching branch
# protection.
#
# CD runs on main after `Checks`, and only for a release: a push that changes
# the version, or a manual run, which releases whatever version is not out
# yet and is how a failed release is retried. It publishes the crate, then the
# GitHub release with the binaries CI built, then the Homebrew formula. The
# macOS release build, which CI has no use for, starts alongside the checks;
# nothing is published until both have passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The macOS runners are few, so a run nobody will look at gives way to the
# next. A pull request's newer push cancels its older run; on main, a newer
# push cancels an older one that releases nothing.
#
# A run that may release is in a group of its own and is never cancelled, and
# nor is a manual run. The group is chosen before any job runs, so it cannot
# ask `changes`. A push may release when its head commit is titled `release: `
# (as `just release` names its pull request) or changes `Cargo.toml`: the
# second catches a version bump merged under any other title, at the cost of
# also keeping a dependency change from being cancelled.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'Cargo.toml')) }}"

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      apple: ${{ steps.filter.outputs.apple }}
      dist: ${{ steps.filter.outputs.dist }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # The domains a change touches, from its diff. A pull request's is
        # against its base. A push's is against the last commit on main whose
        # run passed, so a push whose run was cancelled by the next one is
        # still checked with it. A manual run, a push with no passed commit
        # within reach, or a diff that cannot be worked out, runs everything.
        #
        # Allowlists, so the question is "did any source of this domain
        # change?" rather than "was everything recognisably irrelevant?". The
        # cost is that a new top-level directory of code is invisible here
        # until it is added below. Markdown is documentation wherever it sits.
        #
        # `justfile` and `mise.toml` belong to no domain: no job here runs a
        # recipe or installs a tool from mise, so neither can change a result.
        #
        # Steps run under `bash -e`, where grep finding nothing is a failing
        # command rather than an answer, so every question is asked in a
        # condition.
        run: |
          rust=true apple=true dist=true release=false
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          # A pull request merged or closed as its run was created: the
          # cancelling workflow can look before this run is listed, and the
          # run would otherwise hold runners for a change that is already in.
          # Unanswered, it counts as open.
          state=OPEN
          if [ "$EVENT" = "pull_request" ]; then
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo OPEN)
          fi
          # Empty when it cannot be found: then everything runs, since a
          # narrower diff could leave a cancelled push's changes unchecked.
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ "$passed" = "$(git rev-parse HEAD)" ]; then
              base=HEAD^1
            elif [ -n "$passed" ] && git fetch -q --deepen=200 origin main && git merge-base --is-ancestor "$passed" HEAD; then
              base=$passed
            else
              echo "::notice::no passed run on main within reach -- running everything"
            fi
          fi
          # Whether this run releases, the one answer every release job reads.
          # A pull request: a release PR (branch `release-v*`, or a version
          # change), which runs everything. A push to main: it changes the
          # version and that version is not out yet; comparing with the latest
          # release alone let a push landing while a release ran release it
          # again. A manual run on main, which is how a failed release is
          # retried: whatever version is not out yet.
          version=$(version_of < Cargo.toml)
          bumped=false
          # Against the commit before, not the diff base: a push landing while a
          # release run is still going would otherwise see the same bump and
          # release it again. A bump that is not the head commit is released by
          # a manual run.
          if [ "$(git show HEAD^1:Cargo.toml 2>/dev/null | version_of)" != "$version" ]; then
            bumped=true
          fi
          case "$EVENT" in
            pull_request)
              case "$HEAD_REF" in release-v*) bumped=true ;; esac
              release=$bumped
              ;;
            *)
              # Only a 404 means the version is not out. Any other failure
              # stops the run: guessing either way releases twice or never.
              if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
                if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
                  if printf '%s' "$out" | grep -q 'HTTP 404'; then
                    release=true
                  else
                    echo "::error::cannot tell whether v$version is released: $out"
                    exit 1
                  fi
                fi
              fi
              ;;
          esac
          touches() { printf '%s\n' "$files" | grep -E "$1" | grep -qvE '\.md$'; }
          if [ "$state" != "OPEN" ]; then
            echo "pull request #$PR is no longer open -- skipping everything"
            rust=false apple=false dist=false release=false
          elif [ "$EVENT" != "workflow_dispatch" ] && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$files" | sed 's/^/  /'

            # Anything cargo compiles or packages, or that decides how.
            touches '^\.gitignore$|^LICENSE$|^src/|^tests/|^benches/|^examples/|^build\.rs$|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^\.github/' || rust=false

            # What the release binaries' build adds to the checks: the musl
            # targets and the ARM runner. A pull request builds them only when
            # the dependencies, the toolchain or the recipe change; main
            # whenever the code does, which also warms the cache a release
            # builds from.
            dist=$rust
            if [ "$EVENT" = "pull_request" ]; then
              touches '^build\.rs$|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^\.github/' || dist=false
            fi

            # The macOS runners are few. sift is pure Rust and the Linux jobs
            # check all of it, `cfg!(target_os = "macos")` branches included,
            # since they compile on every platform. A pull request holds a
            # macOS runner only for what Linux cannot check: the Apple
            # toolchain and linker, through the dependencies, the toolchain or
            # CI, or a change to a Rust file that names an Apple target in a
            # cfg. Main runs it for any Rust change.
            apple=false
            if [ "$EVENT" != "pull_request" ]; then
              apple=$rust
            elif touches '^build\.rs$|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^\.github/'; then
              apple=true
            else
              for f in $(printf '%s\n' "$files" | grep '\.rs$' || true); do
                if [ -f "$f" ] && grep -qE 'target_os *= *"(macos|ios)"|target_vendor *= *"apple"' "$f"; then
                  apple=true
                fi
              done
            fi
          fi
          # A release runs everything it ships.
          if [ "$release" = true ]; then
            dist=true
            if [ "$EVENT" = "pull_request" ]; then
              rust=true apple=true
            fi
          fi
          {
            echo "rust=$rust"
            echo "apple=$apple"
            echo "dist=$dist"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  # GitHub has no priority among its runners, and the account's few macOS ones
  # are what a release waits on. A release cancels this repository's pull
  # request runs, which are re-run from their page or by the next push, and
  # main's earlier runs that cannot be releasing, which a newer one supersedes:
  # a push titled `release: ` or changing `Cargo.toml` is left alone, as the
  # workflow's `concurrency` leaves it. At the start rather than in CD, so the
  # release build that starts alongside the checks finds the runners free, and
  # that build waits for it. A job of its own, so only it holds a token that
  # can cancel runs. Best effort: a run it cannot list or cancel only waits
  # longer for a runner.
  make-room:
    name: Make room for the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --status "$status" --limit 100 \
              --json databaseId,event,headBranch,headSha,displayTitle \
              --jq '.[] | select(.event == "pull_request" or (.event == "push" and .headBranch == "main" and (.displayTitle | startswith("release: ") | not))) | "\(.databaseId) \(.event) \(.headSha)"' || true
          done | sort -u | while read -r id event sha; do
            [ "$id" = "$SELF" ] && continue
            if [ "$event" = push ]; then
              changed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.files[].filename') || continue
              if printf '%s\n' "$changed" | grep -qx Cargo.toml; then
                continue
              fi
            fi
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # A newer push cancels a pull request's checks, never main's: a release
    # run's publishing waits on them.
    concurrency:
      group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
          # A failing test would otherwise leave the cache unsaved.
          cache-on-failure: true
      # Offline: the MusicBrainz client is exercised against fixtures, never
      # the live service, which rate-limits and would fail CI for its outages.
      - run: cargo test --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    concurrency:
      group: lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: lint
          cache-on-failure: true
      - run: cargo clippy --locked --all-targets -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make. It runs on every
  # change: the fragments are Markdown, which no domain counts, and the check
  # takes seconds.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # What `cargo publish` uploads, built as crates.io will see it: a file left
  # out of the package, or a dependency that only resolves locally, fails here
  # rather than in the middle of a release.
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    concurrency:
      group: package-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: package
          cache-on-failure: true
      - run: cargo publish --dry-run --locked
      # `cargo publish` unpacks the crate under target/package, which the
      # cache step's clean-up trips over.
      - if: always()
        run: rm -rf target/package

  # The Linux release binaries, static (musl), each on its own architecture,
  # on runners pinned to an OS version. Built once: a release attaches these
  # tarballs as they are.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    timeout-minutes: 45
    concurrency:
      group: build-${{ matrix.name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Tarred, because an artifact does not keep the executable bit; the
      # tarball is the release's download as it stands.
      - name: Package
        run: tar -czf sift-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release sift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sift-${{ matrix.name }}
          path: sift-${{ matrix.name }}.tar.gz
          # Kept for a release, so a publish retried days later still finds them.
          retention-days: ${{ needs.changes.outputs.release == 'true' && 90 || 7 }}

  # Everything checked for Apple, on one runner: the account's macOS runners
  # are few, and every macOS job in every repository queues behind the others.
  # Clippy and the tests on macOS, each reported on its own so one failure does
  # not hide the other. A release pull request also builds and packages the
  # binary, unsigned, so packaging breaks before the version merges.
  #
  # A release push is not checked again: its pull request and main's previous
  # push were. Its build belongs to `macos-release`.
  apple:
    name: Apple
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.apple == 'true' && !(github.event_name != 'pull_request' && needs.changes.outputs.release == 'true')
    timeout-minutes: 60
    concurrency:
      group: apple-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    env:
      TARGET: aarch64-apple-darwin
      PACKAGE: ${{ needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: apple
          cache-on-failure: true
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --locked
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' && env.PACKAGE == 'true' }}
        run: |
          cargo build --release --locked --target "$TARGET"
          tar -czf sift-macos-arm64.tar.gz -C "target/$TARGET/release" sift
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf sift-macos-arm64.tar.gz -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/sift" --version

  # The one status the ruleset requires. Skipped jobs are domains the change
  # does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, test, lint, format, changelog, package, build, apple]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`, and only for a release. `checks` runs whatever
  # its needs did, so every job here states the results it depends on rather
  # than relying on the default, which would skip it whenever any job upstream
  # was skipped.

  # The macOS binary in release, Developer ID signed and notarised, so the
  # tarball runs from a browser download without clearing quarantine. Started
  # by `changes` rather than after `Checks`: it publishes nothing, so it builds
  # while the checks run, and the publishing waits for both. The notarise
  # action fails when a signing secret is missing, so a release never ships an
  # unsigned binary.
  macos-release:
    name: Release (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [changes, make-room]
    if: ${{ !cancelled() && needs.make-room.result == 'success' }}
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: apple-release
      - run: cargo build --release --locked --target "$TARGET"
      - name: Sign and notarise
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/aarch64-apple-darwin/release/sift
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      # The tarball's binary is run, so a package that would not start fails
      # here rather than after a release.
      - name: Package
        run: |
          tar -czf sift-macos-arm64.tar.gz -C "target/$TARGET/release" sift
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf sift-macos-arm64.tar.gz -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/sift" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sift-macos-arm64
          path: sift-macos-arm64.tar.gz
          retention-days: 90

  # Before the GitHub release, and once every binary it ships has built: a
  # version on crates.io cannot be taken back, so it goes out only once the rest
  # of the release can follow it, and a failure here leaves nothing released
  # for a manual run to trip over. Publishing errors on a version already out,
  # so a re-run checks the index first. `package` has already built this
  # commit's crate as crates.io will see it, so the upload skips that build
  # rather than compiling it again from cold.
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, checks, build, macos-release]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') && needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          if curl -sf https://index.crates.io/si/ft/sift-music | grep -q "\"vers\":\"${VERSION}\""; then
            echo "sift-music ${VERSION} is already on crates.io"
            exit 0
          fi
          cargo publish --locked --no-verify

  # Creates the tag through the API, on the commit that was built. The notes
  # are the version's section of CHANGELOG.md.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, crates]
    if: ${{ !cancelled() && needs.crates.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: sift-*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.changes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.changes.outputs.version }}
          body_path: notes.md
          files: artifacts/**/*.tar.gz

  # After the release, so the formula never names a tarball that does not
  # exist. Skips without RELEASE_TOKEN: a token that can push to the tap is
  # the repository owner's to mint.
  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: sift-*
      - name: Write the formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::RELEASE_TOKEN is not set; skipping the Homebrew tap"
            exit 0
          fi
          ARTIFACTS="$PWD/artifacts"
          sha() {
            local f
            f=$(find "$ARTIFACTS" -type f -name "sift-$1.tar.gz" | head -1)
            [ -n "$f" ] || { echo "missing sift-$1.tar.gz" >&2; exit 1; }
            sha256sum "$f" | awk '{print $1}'
          }
          MAC_ARM=$(sha macos-arm64)
          LIN_ARM=$(sha linux-arm64); LIN_X86=$(sha linux-x86_64)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-sift.git" tap
          cd tap
          mkdir -p Formula
          BASE="https://github.com/radiosilence/sift/releases/download/v${VERSION}"
          cat > Formula/sift.rb <<FORMULA
          class Sift < Formula
            desc "Match music against MusicBrainz, tag it, and file it into a library"
            homepage "https://github.com/radiosilence/sift"
            version "${VERSION}"
            license "MIT"
            on_macos do
              depends_on arch: :arm64
              url "${BASE}/sift-macos-arm64.tar.gz"
              sha256 "${MAC_ARM}"
            end
            on_linux do
              on_arm do
                url "${BASE}/sift-linux-arm64.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "${BASE}/sift-linux-x86_64.tar.gz"
                sha256 "${LIN_X86}"
              end
            end
            def install
              bin.install "sift"
            end
            test do
              assert_match "sift", shell_output("#{bin}/sift --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/sift.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sift.rb
          git commit -m "sift ${VERSION}"
          git push
