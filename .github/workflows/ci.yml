name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Offline: the MusicBrainz client is exercised against fixtures, never
      # the live service, which rate-limits and would fail CI for its outages.
      - run: cargo test --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || [ "$VERSION" != "${LATEST#v}" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: tar -czf sift-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release sift
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sift-${{ matrix.name }}
          path: sift-${{ matrix.name }}.tar.gz

  release:
    name: Release
    needs: [test, lint, format, version, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  # After the release, so the formula never names a tarball that does not
  # exist. Skips without RELEASE_TOKEN: a token that can push to the tap is
  # the repository owner's to mint.
  homebrew:
    name: Update Homebrew tap
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Write the formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "RELEASE_TOKEN not set; skipping the tap"
            exit 0
          fi
          ARTIFACTS="$PWD/artifacts"
          sha() {
            local f
            f=$(find "$ARTIFACTS" -type f -name "sift-$1.tar.gz" | head -1)
            [ -n "$f" ] || { echo "missing sift-$1.tar.gz" >&2; exit 1; }
            sha256sum "$f" | awk '{print $1}'
          }
          MAC_ARM=$(sha macos-arm64); MAC_X86=$(sha macos-x86_64)
          LIN_ARM=$(sha linux-arm64); LIN_X86=$(sha linux-x86_64)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-sift.git" tap
          cd tap
          mkdir -p Formula
          BASE="https://github.com/radiosilence/sift/releases/download/v${VERSION}"
          cat > Formula/sift.rb <<FORMULA
          class Sift < Formula
            desc "Match music against MusicBrainz, tag it, and file it into a library"
            homepage "https://github.com/radiosilence/sift"
            version "${VERSION}"
            license "MIT"
            on_macos do
              on_arm do
                url "${BASE}/sift-macos-arm64.tar.gz"
                sha256 "${MAC_ARM}"
              end
              on_intel do
                url "${BASE}/sift-macos-x86_64.tar.gz"
                sha256 "${MAC_X86}"
              end
            end
            on_linux do
              on_arm do
                url "${BASE}/sift-linux-arm64.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "${BASE}/sift-linux-x86_64.tar.gz"
                sha256 "${LIN_X86}"
              end
            end
            def install
              bin.install "sift"
            end
            test do
              assert_match "sift", shell_output("#{bin}/sift --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/sift.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sift.rb
          git commit -m "sift ${VERSION}"
          git push
