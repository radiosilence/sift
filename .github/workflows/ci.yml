name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

# A pull request's newer push cancels its older run. Runs on main are never
# cancelled, since any of them may be publishing a release, and a manual run
# is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Offline: the MusicBrainz client is exercised against fixtures, never
      # the live service, which rate-limits and would fail CI for its outages.
      - run: cargo test --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # What `cargo publish` uploads, built as crates.io will see it: a file left
  # out of the package, or a dependency that only resolves locally, fails here
  # rather than in the middle of a release.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo publish --dry-run --locked
      # `cargo publish` unpacks the crate under target/package, which the
      # cache step's clean-up trips over.
      - if: always()
        run: rm -rf target/package

  version:
    name: Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A push releases only when it changes the version. Comparing with the
      # latest GitHub release alone would let a push that lands while a release
      # is still running release the same version a second time. A manual run
      # releases whatever is unreleased.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          VERSION=$(version_of < Cargo.toml)
          PREVIOUS=$(git show HEAD^:Cargo.toml 2>/dev/null | version_of || true)
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ "$VERSION" = "${LATEST#v}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$VERSION" != "$PREVIOUS" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Decides whether a pull request needs the macOS runner. sift is pure Rust
  # and the Linux jobs check all of it, including `cfg!(target_os = "macos")`
  # branches, which compile on every platform. What Linux cannot check is the
  # Apple toolchain and linker, so the macOS job runs when a pull request
  # changes the dependencies, the toolchain or CI, or a Rust file with
  # Apple-only code. A release pull request bumps Cargo.lock, so it always
  # runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      apple: ${{ steps.diff.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE...HEAD")
          echo "$files"
          apple=false
          if echo "$files" | grep -qE '^(Cargo\.(toml|lock)|mise\.toml|rust-toolchain(\.toml)?|build\.rs|\.cargo/|\.github/)'; then
            apple=true
          fi
          for f in $(echo "$files" | grep '\.rs$' || true); do
            if [ -f "$f" ] && grep -qE 'target_os *= *"(macos|ios)"|target_vendor *= *"apple"' "$f"; then
              apple=true
            fi
          done
          echo "apple=$apple" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: tar -czf sift-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release sift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sift-${{ matrix.name }}
          path: sift-${{ matrix.name }}.tar.gz

  # Everything for Apple, on one runner: the account's macOS runners are few,
  # and every macOS job in every repository queues behind the others. A pull
  # request that needs it (see `changes`) runs clippy and the tests on macOS;
  # a release builds, signs, notarises and packages the arm64 binary, which
  # its pull request has already checked. Other pushes to main do not run it.
  apple:
    name: Apple
    runs-on: macos-latest
    needs: [changes, version]
    if: ${{ !cancelled() && (needs.changes.outputs.apple == 'true' || needs.version.outputs.should_release == 'true') }}
    env:
      TARGET: aarch64-apple-darwin
      RELEASE: ${{ needs.version.outputs.should_release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.RELEASE != 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: env.RELEASE != 'true'
        run: cargo test --locked
      - if: env.RELEASE == 'true'
        run: cargo build --release --locked --target "$TARGET"
      # Developer ID signed and notarised, so the tarball runs from a browser
      # download without clearing quarantine.
      - name: Sign and notarise
        if: env.RELEASE == 'true'
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/aarch64-apple-darwin/release/sift
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Package
        if: env.RELEASE == 'true'
        run: tar -czf sift-macos-arm64.tar.gz -C "target/$TARGET/release" sift
      - if: env.RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sift-macos-arm64
          path: sift-macos-arm64.tar.gz

  # Before the GitHub release: a version on crates.io cannot be taken back, so
  # it goes out only once every check has passed, and a failure here leaves
  # nothing released for a manual run to trip over. Publishing errors on a
  # version already out, so a re-run checks the index first. The package job
  # has already built this commit's crate as crates.io will see it, so the
  # upload skips that build rather than compiling it again from cold.
  crates:
    name: Publish to crates.io
    needs: [test, lint, format, changelog, package, version, build, apple]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if curl -sf https://index.crates.io/si/ft/sift-music | grep -q "\"vers\":\"${VERSION}\""; then
            echo "sift-music ${VERSION} is already on crates.io"
            exit 0
          fi
          cargo publish --locked --no-verify

  # Creates the tag through the API, on the commit that was built. The notes
  # are the version's section of CHANGELOG.md.
  release:
    name: Release
    needs: [version, crates]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: artifacts/**/*.tar.gz

  # After the release, so the formula never names a tarball that does not
  # exist. Skips without RELEASE_TOKEN: a token that can push to the tap is
  # the repository owner's to mint.
  homebrew:
    name: Update Homebrew tap
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Write the formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "RELEASE_TOKEN not set; skipping the tap"
            exit 0
          fi
          ARTIFACTS="$PWD/artifacts"
          sha() {
            local f
            f=$(find "$ARTIFACTS" -type f -name "sift-$1.tar.gz" | head -1)
            [ -n "$f" ] || { echo "missing sift-$1.tar.gz" >&2; exit 1; }
            sha256sum "$f" | awk '{print $1}'
          }
          MAC_ARM=$(sha macos-arm64)
          LIN_ARM=$(sha linux-arm64); LIN_X86=$(sha linux-x86_64)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-sift.git" tap
          cd tap
          mkdir -p Formula
          BASE="https://github.com/radiosilence/sift/releases/download/v${VERSION}"
          cat > Formula/sift.rb <<FORMULA
          class Sift < Formula
            desc "Match music against MusicBrainz, tag it, and file it into a library"
            homepage "https://github.com/radiosilence/sift"
            version "${VERSION}"
            license "MIT"
            on_macos do
              depends_on arch: :arm64
              url "${BASE}/sift-macos-arm64.tar.gz"
              sha256 "${MAC_ARM}"
            end
            on_linux do
              on_arm do
                url "${BASE}/sift-linux-arm64.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "${BASE}/sift-linux-x86_64.tar.gz"
                sha256 "${LIN_X86}"
              end
            end
            def install
              bin.install "sift"
            end
            test do
              assert_match "sift", shell_output("#{bin}/sift --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/sift.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sift.rb
          git commit -m "sift ${VERSION}"
          git push
